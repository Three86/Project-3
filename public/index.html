<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarkov Tracker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Dark by default; the GUI's theme toggle stores the choice in localStorage.themeMode.
    try { document.documentElement.classList.toggle('dark', localStorage.getItem('themeMode') !== 'light'); } catch { /* storage unavailable */ }
  </script>
  <!-- Loads the interface chosen for this browser (public/guis/<id>/) and its section modules
       (public/modules/<id>/). See core/boot.js. -->
  <script type="module" src="core/boot.js"></script>
</head>
<body></body>
</html>
